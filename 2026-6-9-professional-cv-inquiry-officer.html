
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CV Builder</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#eef2f7;
padding:20px;
}

.container{
display:grid;
grid-template-columns:380px 1fr;
gap:20px;
max-width:1600px;
margin:auto;
}

.editor{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
height:fit-content;
}

.editor h2{
margin-bottom:15px;
color:#0f172a;
}

.editor label{
display:block;
margin-top:12px;
font-weight:700;
font-size:14px;
}

.editor input,
.editor textarea{
width:100%;
padding:10px;
margin-top:5px;
border:1px solid #dbe2ea;
border-radius:8px;
font-size:14px;
}

.editor textarea{
resize:vertical;
min-height:100px;
}

.btn{
width:100%;
padding:14px;
margin-top:15px;
border:none;
background:#0f172a;
color:white;
font-size:16px;
font-weight:700;
border-radius:10px;
cursor:pointer;
}

.btn:hover{
background:#1e293b;
}

.cv{
background:white;
width:210mm;
min-height:297mm;
margin:auto;
display:grid;
grid-template-columns:270px 1fr;
overflow:hidden;
box-shadow:0 15px 30px rgba(0,0,0,.12);
}

.sidebar{
background:#0f172a;
color:white;
padding:30px;
}

.photo{
width:140px;
height:140px;
border-radius:50%;
overflow:hidden;
margin:auto;
margin-bottom:20px;
display:none;
border:4px solid gold;
}

.photo img{
width:100%;
height:100%;
object-fit:cover;
}

.name{
text-align:center;
font-size:28px;
font-weight:800;
}

.position{
text-align:center;
color:gold;
margin-top:5px;
font-weight:700;
}

.side-title{
margin-top:25px;
margin-bottom:10px;
font-size:18px;
color:gold;
}

.side-content{
line-height:2;
font-size:14px;
}

.main{
padding:35px;
}

.section{
margin-bottom:25px;
}

.section h3{
font-size:22px;
color:#0f172a;
margin-bottom:10px;
padding-bottom:8px;
border-bottom:3px solid gold;
}

.section p{
line-height:2;
color:#444;
}

.box{
background:#f8fafc;
padding:15px;
border-radius:10px;
border-right:4px solid gold;
line-height:2;
}

.skills{
white-space:pre-line;
}

@media(max-width:1200px){

.container{
grid-template-columns:1fr;
}

.cv{
width:100%;
grid-template-columns:1fr;
}

}

@media print{

.editor,
.btn{
display:none;
}

body{
background:white;
padding:0;
}

.cv{
box-shadow:none;
width:100%;
}

}

</style>
</head>
<body>

<div class="container">

<div class="editor">

<h2>تعديل البيانات</h2>

<label>الاسم</label>
<input id="nameInput" value="اسمك بالكامل">

<label>المسمى الوظيفي</label>
<input id="jobInput" value="Inquiry Officer">

<label>رقم الهاتف</label>
<input id="phoneInput" value="01xxxxxxxxx">

<label>البريد الإلكتروني</label>
<input id="emailInput" value="yourname@gmail.com">

<label>المدينة</label>
<input id="cityInput" value="القاهرة - مصر">

<label>LinkedIn</label>
<input id="linkedinInput" value="linkedin.com/in/yourname">

<label>الصورة الشخصية (اختياري)</label>
<input type="file" id="imageInput" accept="image/*">

<label>الملخص المهني</label>
<textarea id="summaryInput">أخصائي دعم فني بخبرة في خدمة العملاء وحل المشكلات وإدارة الاستفسارات والتواصل الفعال مع العملاء.</textarea>

<label>الخبرات العملية</label>
<textarea id="experienceInput">Technical Support Specialist
شركة XYZ

• التعامل مع العملاء يومياً.
• تحقيق معدل رضا مرتفع.
• حل المشكلات الفنية بسرعة.</textarea>

<label>المهارات</label>
<textarea id="skillsInput">Customer Service
CRM Systems
Microsoft Office
Problem Solving
Communication Skills</textarea>

<label>المؤهل الدراسي</label>
<textarea id="educationInput">بكالوريوس تجارة - جامعة القاهرة</textarea>

<label>الدورات التدريبية</label>
<textarea id="coursesInput">Customer Service
Hotel Operations Basics
Sales Skills</textarea>

<button class="btn" onclick="downloadPDF()">
تحميل PDF
</button>

</div>

<div class="cv" id="cv">

<div class="sidebar">

<div class="photo" id="photoBox">
<img id="photoPreview">
</div>

<div class="name" id="cvName">
اسمك بالكامل
</div>

<div class="position" id="cvJob">
Inquiry Officer
</div>

<div class="side-title">التواصل</div>

<div class="side-content">
<div id="cvPhone">01xxxxxxxxx</div>
<div id="cvEmail">yourname@gmail.com</div>
<div id="cvCity">القاهرة - مصر</div>
<div id="cvLinkedin">linkedin.com/in/yourname</div>
</div>

</div>

<div class="main">

<div class="section">
<h3>الملخص المهني</h3>
<p id="cvSummary"></p>
</div>

<div class="section">
<h3>الخبرات العملية</h3>
<div class="box" id="cvExperience"></div>
</div>

<div class="section">
<h3>المهارات</h3>
<div class="box skills" id="cvSkills"></div>
</div>

<div class="section">
<h3>المؤهل الدراسي</h3>
<div class="box" id="cvEducation"></div>
</div>

<div class="section">
<h3>الدورات التدريبية</h3>
<div class="box" id="cvCourses"></div>
</div>

</div>

</div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script>

function bind(inputId, outputId){

const input=document.getElementById(inputId);
const output=document.getElementById(outputId);

output.innerText=input.value;

input.addEventListener("input",()=>{
output.innerText=input.value;
});

}

bind("nameInput","cvName");
bind("jobInput","cvJob");
bind("phoneInput","cvPhone");
bind("emailInput","cvEmail");
bind("cityInput","cvCity");
bind("linkedinInput","cvLinkedin");
bind("summaryInput","cvSummary");
bind("experienceInput","cvExperience");
bind("skillsInput","cvSkills");
bind("educationInput","cvEducation");
bind("coursesInput","cvCourses");

document.getElementById("imageInput")
.addEventListener("change",function(e){

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=function(event){

document.getElementById("photoPreview").src=
event.target.result;

document.getElementById("photoBox")
.style.display="block";

};

reader.readAsDataURL(file);

});

function downloadPDF(){

const element=document.getElementById("cv");

html2pdf()
.set({
margin:0,
filename:'CV.pdf',
image:{
type:'jpeg',
quality:1
},
html2canvas:{
scale:3
},
jsPDF:{
unit:'mm',
format:'a4',
orientation:'portrait'
}
})
.from(element)
.save();

}

</script>

</body>
</html>
